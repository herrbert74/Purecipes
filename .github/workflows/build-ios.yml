name: Build iOS

on:
  pull_request:
    paths:
      - 'iosApp/**'
      - 'umbrella/**'
      - 'feature/ads/**'
      - 'scripts/ios/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Simulator build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Usercentrics XCFrameworks
        uses: actions/cache@v6
        with:
          path: iosApp/PurecipesIOSApp/LocalPackages/XCFrameworks
          key: usercentrics-${{ hashFiles('scripts/ios/fetch-usercentrics-xcframeworks.sh') }}

      - name: Fetch Usercentrics XCFrameworks
        run: ./scripts/ios/fetch-usercentrics-xcframeworks.sh

      - name: Sync iOS marketing version
        run: ./gradlew :umbrella:syncIosVersion

      - name: Build iOS app for simulator
        run: |
          xcodebuild \
            -project iosApp/PurecipesIOSApp/PurecipesIOSApp.xcodeproj \
            -scheme PurecipesIOSApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
