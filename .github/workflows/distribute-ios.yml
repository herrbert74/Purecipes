name: Distribute iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_testflight:
        description: Skip TestFlight upload (archive IPA only)
        required: false
        type: boolean
        default: false
      skip_firebase:
        description: Skip Firebase App Distribution
        required: false
        type: boolean
        default: true

jobs:
  distribute:
    name: Archive and upload to TestFlight
    runs-on: macos-latest
    env:
      XCODE_DERIVED_DATA_PATH: ${{ runner.temp }}/PurecipesDerivedData
      XCODE_SOURCE_PACKAGES_PATH: ${{ runner.temp }}/SourcePackages

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from tag
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "${REF}" == v* ]]; then
            SEMVER="${REF#v}"
            SEMVER="${SEMVER%%-*}"
          else
            SEMVER=$(grep -E '^versionName = ' gradle/libs.versions.toml | sed -E 's/versionName = "(.*)"/\1/')
          fi
          if ! [[ "${SEMVER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve semver from tag or libs.versions.toml: ${SEMVER}" >&2
            exit 1
          fi
          echo "semver=${SEMVER}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${SEMVER}"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install Kotlin compiler
        run: |
          chmod +x .github/scripts/install-kotlin-compiler.sh
          .github/scripts/install-kotlin-compiler.sh

      - name: Extract release notes from CHANGELOG
        run: |
          kotlin scripts/release/extract_release_notes.main.kts "${{ steps.version.outputs.semver }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Require App Store Connect API key
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_testflight != true }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=0
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} repository secret is required for iOS TestFlight uploads." >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Require iOS distribution signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          PURECIPES_IOS_DEVELOPMENT_TEAM: ${{ secrets.PURECIPES_IOS_DEVELOPMENT_TEAM }}
        run: |
          missing=0
          for name in IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 PURECIPES_IOS_DEVELOPMENT_TEAM; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} repository secret is required for iOS release signing." >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Require iOS RevenueCat and AdMob IDs
        env:
          PURECIPES_REVENUECAT_IOS_API_KEY: ${{ secrets.PURECIPES_REVENUECAT_IOS_API_KEY }}
          PURECIPES_ADMOB_IOS_APP_ID: ${{ secrets.PURECIPES_ADMOB_IOS_APP_ID }}
          PURECIPES_ADMOB_IOS_BANNER_AD_UNIT_ID: ${{ secrets.PURECIPES_ADMOB_IOS_BANNER_AD_UNIT_ID }}
          PURECIPES_ADMOB_IOS_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.PURECIPES_ADMOB_IOS_INTERSTITIAL_AD_UNIT_ID }}
        run: |
          missing=0
          for name in PURECIPES_REVENUECAT_IOS_API_KEY PURECIPES_ADMOB_IOS_APP_ID PURECIPES_ADMOB_IOS_BANNER_AD_UNIT_ID PURECIPES_ADMOB_IOS_INTERSTITIAL_AD_UNIT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} repository secret is required for iOS release builds." >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          if [[ "${PURECIPES_REVENUECAT_IOS_API_KEY}" != appl_* ]]; then
            echo "::error::PURECIPES_REVENUECAT_IOS_API_KEY must be an App Store SDK key (appl_…)." >&2
            exit 1
          fi

      - name: Write App Store Connect API key
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_testflight != true }}
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s\n' "${APP_STORE_CONNECT_API_KEY_P8}" > "${KEY_PATH}"
          echo "APP_STORE_CONNECT_API_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Install iOS distribution signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          PURECIPES_IOS_DEVELOPMENT_TEAM: ${{ secrets.PURECIPES_IOS_DEVELOPMENT_TEAM }}
        run: |
          CERTIFICATE_PATH="${RUNNER_TEMP}/distribution.p12"
          DOWNLOADED_PROFILE_PATH="${RUNNER_TEMP}/app-store.mobileprovision"
          PROFILE_PLIST_PATH="${RUNNER_TEMP}/app-store-profile.plist"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "${IOS_DISTRIBUTION_CERTIFICATE_BASE64}" | base64 -D > "${CERTIFICATE_PATH}"
          printf '%s' "${IOS_APP_STORE_PROVISIONING_PROFILE_BASE64}" | base64 -D > "${DOWNLOADED_PROFILE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"

          if ! security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -q '"Apple Distribution:'; then
            echo "::error::The certificate secret does not contain an Apple Distribution identity with its private key." >&2
            exit 1
          fi

          security cms -D -i "${DOWNLOADED_PROFILE_PATH}" > "${PROFILE_PLIST_PATH}"
          PROFILE_UUID="$(plutil -extract UUID raw "${PROFILE_PLIST_PATH}")"
          PROFILE_TEAM_ID="$(plutil -extract TeamIdentifier.0 raw "${PROFILE_PLIST_PATH}")"
          PROFILE_APP_IDENTIFIER="$(plutil -extract Entitlements.application-identifier raw "${PROFILE_PLIST_PATH}")"
          PROFILE_BUNDLE_ID="${PROFILE_APP_IDENTIFIER#*.}"

          if [[ "${PROFILE_TEAM_ID}" != "${PURECIPES_IOS_DEVELOPMENT_TEAM}" ]]; then
            echo "::error::The provisioning profile belongs to team ${PROFILE_TEAM_ID}, not ${PURECIPES_IOS_DEVELOPMENT_TEAM}." >&2
            exit 1
          fi
          if [[ "${PROFILE_BUNDLE_ID}" != "app.purecipes.PurecipesIOSApp" ]]; then
            echo "::error::The provisioning profile is for ${PROFILE_BUNDLE_ID}, not app.purecipes.PurecipesIOSApp." >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "${PROFILE_PLIST_PATH}" >/dev/null 2>&1; then
            echo "::error::The provisioning profile is for registered devices, not App Store distribution." >&2
            exit 1
          fi

          INSTALLED_PROFILE_PATH="${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          mkdir -p "$(dirname "${INSTALLED_PROFILE_PATH}")"
          cp "${DOWNLOADED_PROFILE_PATH}" "${INSTALLED_PROFILE_PATH}"
          echo "IOS_PROVISIONING_PROFILE_UUID=${PROFILE_UUID}" >> "${GITHUB_ENV}"
          echo "IOS_INSTALLED_PROFILE_PATH=${INSTALLED_PROFILE_PATH}" >> "${GITHUB_ENV}"
          echo "IOS_SIGNING_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: Cache Usercentrics XCFrameworks
        uses: actions/cache@v6
        with:
          path: iosApp/PurecipesIOSApp/LocalPackages/XCFrameworks
          key: usercentrics-${{ hashFiles('scripts/ios/fetch-usercentrics-xcframeworks.sh') }}

      - name: Fetch Usercentrics XCFrameworks
        run: ./scripts/ios/fetch-usercentrics-xcframeworks.sh

      - name: Resolve Xcode cache version
        id: xcode
        run: |
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          XCODE_BUILD_VERSION="$(xcodebuild -version | awk '/^Build version / { print $3 }')"
          echo "cache-version=${XCODE_VERSION}-${XCODE_BUILD_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Cache Swift packages
        id: swift-package-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.XCODE_SOURCE_PACKAGES_PATH }}
          key: xcode-source-packages-v1-${{ runner.os }}-${{ steps.xcode.outputs.cache-version }}-${{ hashFiles('.swiftpm-locks/**/Package.resolved', 'iosApp/**/Package.resolved', 'iosApp/**/Package.swift', 'iosApp/**/*.pbxproj') }}

      - name: Cache Xcode DerivedData
        id: derived-data-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.XCODE_DERIVED_DATA_PATH }}
          key: xcode-derived-data-v1-${{ runner.os }}-${{ steps.xcode.outputs.cache-version }}-${{ hashFiles('.swiftpm-locks/**/Package.resolved', 'iosApp/**/Package.resolved', 'iosApp/**/Package.swift', 'iosApp/**/*.pbxproj', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            xcode-derived-data-v1-${{ runner.os }}-${{ steps.xcode.outputs.cache-version }}-${{ hashFiles('.swiftpm-locks/**/Package.resolved', 'iosApp/**/Package.resolved', 'iosApp/**/Package.swift', 'iosApp/**/*.pbxproj', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Sync iOS marketing version
        run: ./gradlew :umbrella:syncIosVersion

      - name: Archive iOS app
        env:
          PURECIPES_REVENUECAT_IOS_API_KEY: ${{ secrets.PURECIPES_REVENUECAT_IOS_API_KEY }}
          PURECIPES_ADMOB_IOS_APP_ID: ${{ secrets.PURECIPES_ADMOB_IOS_APP_ID }}
          PURECIPES_ADMOB_IOS_BANNER_AD_UNIT_ID: ${{ secrets.PURECIPES_ADMOB_IOS_BANNER_AD_UNIT_ID }}
          PURECIPES_ADMOB_IOS_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.PURECIPES_ADMOB_IOS_INTERSTITIAL_AD_UNIT_ID }}
          PURECIPES_IOS_DEVELOPMENT_TEAM: ${{ secrets.PURECIPES_IOS_DEVELOPMENT_TEAM }}
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/PurecipesIOSApp.xcarchive"
          echo "ARCHIVE_PATH=${ARCHIVE_PATH}" >> "${GITHUB_ENV}"
          xcodebuild \
            -project iosApp/PurecipesIOSApp/PurecipesIOSApp.xcodeproj \
            -scheme PurecipesIOSApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${ARCHIVE_PATH}" \
            -derivedDataPath "${XCODE_DERIVED_DATA_PATH}" \
            -clonedSourcePackagesDirPath "${XCODE_SOURCE_PACKAGES_PATH}" \
            -skipPackagePluginValidation \
            -showBuildTimingSummary \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${PURECIPES_IOS_DEVELOPMENT_TEAM}" \
            PROVISIONING_PROFILE_SPECIFIER="${IOS_PROVISIONING_PROFILE_UUID}" \
            PURECIPES_ADMOB_APP_ID="${PURECIPES_ADMOB_IOS_APP_ID}" \
            archive

      - name: Save Swift package cache
        if: ${{ steps.swift-package-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.XCODE_SOURCE_PACKAGES_PATH }}
          key: ${{ steps.swift-package-cache.outputs.cache-primary-key }}

      - name: Save Xcode DerivedData cache
        if: ${{ steps.derived-data-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.XCODE_DERIVED_DATA_PATH }}
          key: ${{ steps.derived-data-cache.outputs.cache-primary-key }}

      - name: Export IPA
        env:
          PURECIPES_IOS_DEVELOPMENT_TEAM: ${{ secrets.PURECIPES_IOS_DEVELOPMENT_TEAM }}
        run: |
          EXPORT_DIR="${RUNNER_TEMP}/ios-export"
          EXPORT_PLIST="${RUNNER_TEMP}/exportOptions.plist"
          mkdir -p "${EXPORT_DIR}"
          cat > "${EXPORT_PLIST}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${PURECIPES_IOS_DEVELOPMENT_TEAM}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.purecipes.PurecipesIOSApp</key>
              <string>${IOS_PROVISIONING_PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${EXPORT_DIR}" \
            -exportOptionsPlist "${EXPORT_PLIST}"
          IPA_PATH="$(ls "${EXPORT_DIR}"/*.ipa | head -n 1)"
          echo "IPA_PATH=${IPA_PATH}" >> "${GITHUB_ENV}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-${{ steps.version.outputs.semver }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload IPA to TestFlight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_testflight != true }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_DIR="${HOME}/.appstoreconnect/private_keys"
          mkdir -p "${KEY_DIR}"
          cp "${APP_STORE_CONNECT_API_KEY_PATH}" "${KEY_DIR}/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "${IPA_PATH}" \
            --apiKey "${APP_STORE_CONNECT_API_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"

      - name: Upload IPA to Firebase App Distribution
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_firebase != true }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is required for iOS Firebase App Distribution." >&2
            exit 1
          fi
          CREDS_PATH="${RUNNER_TEMP}/firebase-sa.json"
          echo "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${CREDS_PATH}"
          export GOOGLE_APPLICATION_CREDENTIALS="${CREDS_PATH}"
          npx -y firebase-tools@latest appdistribution:distribute "${IPA_PATH}" \
            --app 1:922845075790:ios:0ec36d5c442908cf74a61f \
            --groups alpha-testers \
            --release-notes-file "${GITHUB_WORKSPACE}/build/release-notes.txt" \
            --project purecipes-50e5c

      - name: Clean up iOS distribution signing assets
        if: ${{ always() }}
        run: |
          if [[ -n "${IOS_SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${IOS_SIGNING_KEYCHAIN_PATH}"
          fi
          if [[ -n "${IOS_INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "${IOS_INSTALLED_PROFILE_PATH}"
          fi
