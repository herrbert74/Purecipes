name: Distribute Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_firebase:
        description: Skip Firebase App Distribution (Play upload only)
        required: false
        type: boolean
        default: false

jobs:
  distribute:
    name: Build and upload to Firebase and Google Play
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from tag
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "${REF}" == v* ]]; then
            SEMVER="${REF#v}"
            SEMVER="${SEMVER%%-*}"
          else
            SEMVER=$(grep -E '^versionName = ' gradle/libs.versions.toml | sed -E 's/versionName = "(.*)"/\1/')
          fi
          if ! [[ "${SEMVER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve semver from tag or libs.versions.toml: ${SEMVER}" >&2
            exit 1
          fi
          echo "semver=${SEMVER}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${SEMVER}"

      - name: Resolve skip Firebase
        id: flags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.skip_firebase }}" == "true" ]]; then
            SKIP_FIREBASE=true
          else
            SKIP_FIREBASE=false
          fi
          echo "skip_firebase=${SKIP_FIREBASE}" >> "${GITHUB_OUTPUT}"
          echo "skip_firebase=${SKIP_FIREBASE}"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Kotlin compiler
        run: |
          chmod +x .github/scripts/install-kotlin-compiler.sh
          .github/scripts/install-kotlin-compiler.sh

      - name: Extract release notes from CHANGELOG
        run: |
          kotlin scripts/release/extract_release_notes.main.kts "${{ steps.version.outputs.semver }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        env:
          PURECIPES_SIGNING_STORE_FILE_BASE64: ${{ secrets.PURECIPES_SIGNING_STORE_FILE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/purecipes-release.keystore"
          echo "${PURECIPES_SIGNING_STORE_FILE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          echo "PURECIPES_SIGNING_STORE_FILE=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          CREDS_PATH="${RUNNER_TEMP}/firebase-sa.json"
          echo "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${CREDS_PATH}"
          echo "FIREBASE_SERVICE_ACCOUNT_FILE=${CREDS_PATH}" >> "${GITHUB_ENV}"

      - name: Write Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON repository secret is required for Google Play uploads." >&2
            exit 1
          fi
          CREDS_PATH="${RUNNER_TEMP}/play-sa.json"
          echo "${PLAY_SERVICE_ACCOUNT_JSON}" > "${CREDS_PATH}"
          echo "PLAY_SERVICE_ACCOUNT_FILE=${CREDS_PATH}" >> "${GITHUB_ENV}"

      - name: Require Google web client ID for release build
        env:
          PURECIPES_GOOGLE_WEB_CLIENT_ID: ${{ secrets.PURECIPES_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [[ -z "${PURECIPES_GOOGLE_WEB_CLIENT_ID}" ]]; then
            echo "::error::PURECIPES_GOOGLE_WEB_CLIENT_ID repository secret is required for release builds (Google Sign-In)." >&2
            exit 1
          fi

      - name: Require Mixpanel project token for release build
        env:
          PURECIPES_MIXPANEL_PROJECT_TOKEN: ${{ secrets.PURECIPES_MIXPANEL_PROJECT_TOKEN }}
        run: |
          if [[ -z "${PURECIPES_MIXPANEL_PROJECT_TOKEN}" ]]; then
            echo "::error::PURECIPES_MIXPANEL_PROJECT_TOKEN repository secret is required for release builds (Mixpanel)." >&2
            exit 1
          fi

      - name: Require RevenueCat API key for release build
        env:
          PURECIPES_REVENUECAT_API_KEY: ${{ secrets.PURECIPES_REVENUECAT_API_KEY }}
        run: |
          if [[ -z "${PURECIPES_REVENUECAT_API_KEY}" ]]; then
            echo "::error::PURECIPES_REVENUECAT_API_KEY repository secret is required for release builds (RevenueCat Google Play key)." >&2
            exit 1
          fi
          if [[ "${PURECIPES_REVENUECAT_API_KEY}" != goog_* ]]; then
            echo "::error::PURECIPES_REVENUECAT_API_KEY must be a Google Play SDK key (goog_…)." >&2
            exit 1
          fi

      - name: Require AdMob IDs for release build
        env:
          PURECIPES_ADMOB_APP_ID: ${{ secrets.PURECIPES_ADMOB_APP_ID }}
          PURECIPES_ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.PURECIPES_ADMOB_BANNER_AD_UNIT_ID }}
          PURECIPES_ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.PURECIPES_ADMOB_INTERSTITIAL_AD_UNIT_ID }}
        run: |
          missing=0
          for name in PURECIPES_ADMOB_APP_ID PURECIPES_ADMOB_BANNER_AD_UNIT_ID PURECIPES_ADMOB_INTERSTITIAL_AD_UNIT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} repository secret is required for release builds (production AdMob)." >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Build release AAB
        env:
          PURECIPES_GOOGLE_WEB_CLIENT_ID: ${{ secrets.PURECIPES_GOOGLE_WEB_CLIENT_ID }}
          PURECIPES_MIXPANEL_PROJECT_TOKEN: ${{ secrets.PURECIPES_MIXPANEL_PROJECT_TOKEN }}
          PURECIPES_REVENUECAT_API_KEY: ${{ secrets.PURECIPES_REVENUECAT_API_KEY }}
          PURECIPES_ADMOB_APP_ID: ${{ secrets.PURECIPES_ADMOB_APP_ID }}
          PURECIPES_ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.PURECIPES_ADMOB_BANNER_AD_UNIT_ID }}
          PURECIPES_ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.PURECIPES_ADMOB_INTERSTITIAL_AD_UNIT_ID }}
          PURECIPES_SIGNING_STORE_PASSWORD: ${{ secrets.PURECIPES_SIGNING_STORE_PASSWORD }}
          PURECIPES_SIGNING_KEY_ALIAS: ${{ secrets.PURECIPES_SIGNING_KEY_ALIAS }}
          PURECIPES_SIGNING_KEY_PASSWORD: ${{ secrets.PURECIPES_SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease \
            -Ppurecipes.revenueCatApiKey.release="${PURECIPES_REVENUECAT_API_KEY}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.semver }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload AAB to Firebase App Distribution
        if: ${{ steps.flags.outputs.skip_firebase != 'true' }}
        env:
          PURECIPES_GOOGLE_WEB_CLIENT_ID: ${{ secrets.PURECIPES_GOOGLE_WEB_CLIENT_ID }}
          PURECIPES_MIXPANEL_PROJECT_TOKEN: ${{ secrets.PURECIPES_MIXPANEL_PROJECT_TOKEN }}
          PURECIPES_REVENUECAT_API_KEY: ${{ secrets.PURECIPES_REVENUECAT_API_KEY }}
          PURECIPES_ADMOB_APP_ID: ${{ secrets.PURECIPES_ADMOB_APP_ID }}
          PURECIPES_ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.PURECIPES_ADMOB_BANNER_AD_UNIT_ID }}
          PURECIPES_ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.PURECIPES_ADMOB_INTERSTITIAL_AD_UNIT_ID }}
          PURECIPES_SIGNING_STORE_PASSWORD: ${{ secrets.PURECIPES_SIGNING_STORE_PASSWORD }}
          PURECIPES_SIGNING_KEY_ALIAS: ${{ secrets.PURECIPES_SIGNING_KEY_ALIAS }}
          PURECIPES_SIGNING_KEY_PASSWORD: ${{ secrets.PURECIPES_SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:appDistributionUploadRelease \
            -PfirebaseAppDistribution.serviceCredentialsFile="${FIREBASE_SERVICE_ACCOUNT_FILE}" \
            -Ppurecipes.revenueCatApiKey.release="${PURECIPES_REVENUECAT_API_KEY}"

      - name: Upload AAB to Google Play closed testing
        run: |
          ./gradlew :tools:play-publish:uploadPlayRelease \
            -Ppurecipes.play.serviceAccountJson="${PLAY_SERVICE_ACCOUNT_FILE}" \
            -Ppurecipes.play.aab="${GITHUB_WORKSPACE}/app/build/outputs/bundle/release/app-release.aab" \
            -Ppurecipes.play.mapping="${GITHUB_WORKSPACE}/app/build/outputs/mapping/release/mapping.txt" \
            -Ppurecipes.play.track=alpha \
            -Ppurecipes.play.status=completed \
            -Ppurecipes.play.releaseName="${{ steps.version.outputs.semver }}" \
            -Ppurecipes.play.releaseNotesFile="${GITHUB_WORKSPACE}/build/release-notes.txt"
