name: Build and test on push or pull request

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: # Allows manual triggering
    inputs:
      ui_test_tags:
        description: "Comma-separated UI test tags (e.g. UiTestEssential,UiTestSearch) or UiTestAll"
        required: false
        default: "UiTestAll"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        build-scan-publish: true
        build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
        build-scan-terms-of-use-agree: "yes"
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Build with Gradle Wrapper
      run: ./gradlew assembleDebug

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run JVM Tests
        run: ./gradlew jvmTest --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: '**/build/reports/tests/'

  # Mac Silicon does not work
  # https://github.com/ReactiveCircus/android-emulator-runner/issues/350
  # https://github.com/actions/runner-images/issues/9460
  android-test:
    name: UI tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        api-level: [28, 34]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # This is not needed for GitHubHostedRunner anymore
      #- name: Setup Android SDK
      # uses: android-actions/setup-android@v3

      # BUT this might be needed for SelfHostedRunner if we move to it
      # https://github.com/amyu/setup-android

      - name: Resolve UI test tags
        id: ui-test-tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAGS: ${{ github.event.inputs.ui_test_tags }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            selected="${DISPATCH_TAGS:-UiTestAll}"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            selected=""
            IFS=',' read -r -a label_array <<< "${PR_LABELS}"
            for label in "${label_array[@]}"; do
              label="$(printf '%s' "${label}" | tr -d '[:space:]')"
              case "${label}" in
                UiTest*)
                  if [[ -n "${selected}" ]]; then
                    selected="${selected},"
                  fi
                  selected="${selected}${label}"
                  ;;
              esac
            done
            if [[ -z "${selected}" ]]; then
              selected="UiTestEssential"
            fi
          else
            selected="UiTestAll"
          fi
          echo "tags=${selected}" >> "${GITHUB_OUTPUT}"
          echo "Resolved UI test tags: ${selected}"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        if: false # temporarily disable cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            ./gradlew
            --max-workers=2
            --no-parallel
            --no-build-cache
            --no-configuration-cache
            -Pkotlin.native.enableKlibsCrossCompilation=false
            -Pkotlin.native.ignoreDisabledTargets=true
            "-PuiTestTags=${{ steps.ui-test-tags.outputs.tags }}"
            "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
            "-Dkotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC"
            connectedAndroidTest;
            killall -INT crashpad_handler || true

      - name: Verify instrumented UI tests executed
        env:
          UI_TEST_TAGS: ${{ steps.ui-test-tags.outputs.tags }}
        run: ./.github/scripts/verify-connected-ui-tests.sh

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report-${{ matrix.api-level }}
          path: '**/build/reports/androidTests/connected/'

  static-analysis:
    name: Execute static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run detekt
        run: ./gradlew detektAll
